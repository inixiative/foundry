name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx inixiative-config check .
      # typecheck, lint, then the replay-only suites; the freshness check fails stale, unblessed, leaking or unreviewed cassettes.
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
